name: Build Home Assistant image

# Builds the app's Home Assistant image and pushes it to
# ghcr.io/<owner>/aw-app-home-assistant.
#
#   gh workflow run build.yml                        # amd64
#   gh workflow run build.yml -f include_arm64=true  # + linux/arm64 (QEMU)
#
# One-time manual step after the FIRST push: GitHub creates the container
# package private regardless of this repo's visibility, and there is no
# REST/GraphQL endpoint to flip it (see aw-app-browser's build.yml for the
# 2026-07-28 confirmation). Until someone with org admin does it by hand at
#   github.com/orgs/tekflox/packages/container/aw-app-home-assistant/settings
#   -> Danger Zone -> Change visibility -> Public
# a tokenless install cannot pull this image.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: build-aw-app-home-assistant-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: aw-app-home-assistant
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Read app version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print(f"version={json.load(open('aw-app.json'))['version']}")
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: container
          file: container/Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:v${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🏠 aw-app-home-assistant pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:latest\` |"
            echo "| **Version tag** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-home-assistant:v${{ steps.version.outputs.version }}\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
